<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#B45309">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<title>RECDAVI</title>
<style>
:root{
  --blue:#B45309; --blue-dk:#8a3f07; --blue-lt:#FFF7ED;
  --surface:#f4f4f0; --card:#fff; --card2:#fafaf7;
  --border:#e0ddd6; --border-s:#ccc;
  --text:#1a1a18; --t2:#555; --t3:#888; --t4:#bbb;
  --green:#1b7a4a; --green-bg:#ecfdf5; --green-bd:#a7f3d0;
  --amber:#b45309; --amber-bg:#fffbeb; --amber-bd:#fde68a;
  --red:#b91c1c; --red-bg:#fef2f2; --red-bd:#fecaca;
  --r:10px; --shadow:0 2px 10px rgba(0,0,0,.12);
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bot:env(safe-area-inset-bottom,0px);
}
@media(prefers-color-scheme:dark){
  :root{
    --surface:#12151e; --card:#1c2033; --card2:#222640;
    --border:#2a2f47; --border-s:#3a4060;
    --text:#e8e9f0; --t2:#9fa3be; --t3:#666a88; --t4:#383d5a;
    --blue-lt:#2a1e0f;
    --green-bg:#0d2e1f; --amber-bg:#2a1e00; --red-bg:#2a0d0d;
    --shadow:0 2px 10px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --surface:#12151e; --card:#1c2033; --card2:#222640;
  --border:#2a2f47; --border-s:#3a4060;
  --text:#e8e9f0; --t2:#9fa3be; --t3:#666a88; --t4:#383d5a;
  --blue-lt:#2a1e0f;
  --green-bg:#0d2e1f; --amber-bg:#2a1e00; --red-bg:#2a0d0d;
  --shadow:0 2px 10px rgba(0,0,0,.4);
}
:root[data-theme="light"]{
  --surface:#f4f4f0; --card:#fff; --card2:#fafaf7;
  --border:#e0ddd6; --border-s:#ccc;
  --text:#1a1a18; --t2:#555; --t3:#888; --t4:#bbb;
  --blue-lt:#FFF7ED;
  --green-bg:#ecfdf5; --amber-bg:#fffbeb; --red-bg:#fef2f2;
  --shadow:0 2px 10px rgba(0,0,0,.12);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--surface);color:var(--text);font-size:14px;display:flex;flex-direction:column;overflow-x:hidden}

.hdr{background:var(--blue);color:#fff;padding:calc(10px + var(--safe-top)) 14px 10px;display:flex;align-items:center;gap:10px;flex-shrink:0;box-shadow:0 2px 10px rgba(0,0,0,.3);position:sticky;top:0;z-index:50}
.hdr-back{width:32px;height:32px;border:none;background:rgba(255,255,255,.15);border-radius:var(--r);color:#fff;font-size:16px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.hdr-back:disabled{opacity:0;pointer-events:none}
.hdr-title{flex:1;min-width:0}
.hdr-title .t1{font-size:15px;font-weight:700}
.hdr-title .t2{font-size:10px;opacity:.75}
.hdr-acts{display:flex;align-items:center;gap:6px}
.hdr-btn{width:32px;height:32px;border:none;background:rgba(255,255,255,.15);border-radius:var(--r);color:#fff;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;position:relative}
.hdr-btn:hover{background:rgba(255,255,255,.27)}
.hdr-badge{position:absolute;top:-4px;right:-4px;background:#facc15;color:#1a1a18;font-size:9px;font-weight:800;border-radius:99px;min-width:15px;height:15px;display:flex;align-items:center;justify-content:center;padding:0 3px}

.app{flex:1;display:flex;flex-direction:column;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:calc(16px + var(--safe-bot))}
.app.has-selbar{padding-bottom:calc(78px + var(--safe-bot))}
.wrap{padding:14px;display:flex;flex-direction:column;gap:10px;max-width:560px;margin:0 auto;width:100%}

.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:14px;box-shadow:var(--shadow)}
.hint{font-size:12px;color:var(--t3);line-height:1.5;padding:2px 2px 4px}

.btn{height:46px;border:none;border-radius:var(--r);font-size:14px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;width:100%}
.btn-primary{background:var(--blue);color:#fff}
.btn-primary:hover{background:var(--blue-dk)}
.btn-secondary{background:var(--card2);color:var(--text);border:1px solid var(--border-s)}
.btn-secondary:hover{background:var(--border)}
.btn-green{background:var(--green);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-sm{height:34px;font-size:12px;padding:0 12px;width:auto}

.list-item{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:12px 14px;display:flex;align-items:center;gap:10px;cursor:pointer;transition:background .12s,border-color .12s}
.list-item:hover{background:var(--card2)}
.list-item.sel{border-color:var(--blue);background:var(--blue-lt)}
.list-item.disabled{cursor:not-allowed;opacity:.6}
.list-item.disabled:hover{background:var(--card)}
.list-item .li-main{flex:1;min-width:0}
.li-title{font-size:14px;font-weight:700;color:var(--text)}
.li-sub{font-size:11px;color:var(--t3);margin-top:2px}
.li-arrow{color:var(--t4);font-size:16px}
.li-progress{width:100%;height:5px;border-radius:99px;background:var(--surface);border:1px solid var(--border);margin-top:7px;overflow:hidden}
.li-progress-bar{height:100%;background:var(--blue);border-radius:99px;width:0%;transition:width .4s ease}
.li-pct{font-size:12.5px;font-weight:700;color:var(--blue);flex-shrink:0;min-width:36px;text-align:right}
.li-check{width:22px;height:22px;border-radius:6px;border:2px solid var(--border-s);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff;background:var(--card)}
.list-item.sel .li-check{background:var(--blue);border-color:var(--blue)}

.selbar{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--card);border-top:1px solid var(--border);box-shadow:0 -2px 10px rgba(0,0,0,.12);padding:10px 14px calc(10px + var(--safe-bot));display:flex;align-items:center;gap:10px}
.selbar .selbar-count{font-size:12.5px;font-weight:700;color:var(--text);flex-shrink:0;white-space:nowrap}
.selbar .btn{width:auto;flex:1;height:42px}

.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:700;white-space:nowrap;flex-shrink:0}
.pill-green{background:var(--green-bg);color:var(--green);border:1px solid var(--green-bd)}
.pill-amber{background:var(--amber-bg);color:var(--amber);border:1px solid var(--amber-bd)}
.pill-gray{background:var(--surface);color:var(--t3);border:1px solid var(--border)}
.pill-red{background:var(--red-bg);color:var(--red);border:1px solid var(--red-bd)}

.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:11px;font-weight:700;color:var(--t2);text-transform:uppercase;letter-spacing:.4px}
.field input,.field select,.field textarea{
  height:44px;padding:0 12px;border:1px solid var(--border-s);border-radius:var(--r);
  background:var(--surface);color:var(--text);font-size:15px;width:100%
}
.field textarea{height:auto;min-height:80px;padding:10px 12px;resize:vertical;font-family:inherit}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 2px rgba(180,83,9,.18)}
.chk-row{display:flex;align-items:center;gap:8px}
.chk-row input{width:20px;height:20px;accent-color:var(--blue)}

.state{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:50px 20px;text-align:center;color:var(--t3);flex:1}
.state .ico{font-size:44px;opacity:.4}
.state h3{font-size:16px;color:var(--t2);font-weight:700}
.state p{font-size:12.5px;max-width:320px;line-height:1.6}
.spin-ring{width:34px;height:34px;border:3px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.toast{position:fixed;bottom:calc(18px + var(--safe-bot));left:50%;transform:translateX(-50%) translateY(80px);background:#1a1a18;color:#fff;padding:10px 18px;border-radius:var(--r);font-size:12.5px;font-weight:500;z-index:1000;transition:transform .3s cubic-bezier(.34,1.56,.64,1);max-width:90vw;text-align:center;box-shadow:var(--shadow)}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.ok{background:#1b7a4a}
.toast.warn{background:#b45309}
.toast.err{background:#b91c1c}

.foot{font-size:10px;color:var(--t3);text-align:center;padding:6px 14px}

/* Resumen */
.res-table{width:100%;border-collapse:collapse;font-size:12.5px}
.res-table th{padding:7px 9px;text-align:left;font-size:10.5px;font-weight:700;color:var(--t2);border-bottom:2px solid var(--border-s);background:var(--card2)}
.res-table td{padding:6px 9px;border-bottom:1px solid var(--border)}
.res-table td.num{text-align:right}
.res-table tfoot td{font-weight:700;background:var(--blue-lt);color:var(--blue)}
.res-block-title{font-size:12px;font-weight:700;color:var(--blue);margin-bottom:6px;display:flex;justify-content:space-between}
.grand-total{background:var(--blue);color:#fff;border-radius:var(--r);padding:14px 16px;font-size:16px;font-weight:700;display:flex;justify-content:space-between;align-items:center}

@media print{
  .hdr,.no-print{display:none!important}
  html,body{height:auto;overflow:visible;background:#fff}
  .app{overflow:visible}
}
</style>
</head>
<body>

<div class="hdr">
  <button class="hdr-back" id="hdr-back" onclick="goBack()" disabled>←</button>
  <button class="hdr-back" id="hdr-forward" onclick="goForward()" disabled>→</button>
  <div class="hdr-title">
    <div class="t1" id="hdr-t1">RECDAVI</div>
    <div class="t2" id="hdr-t2">Cargando…</div>
  </div>
  <div class="hdr-acts">
    <button class="hdr-btn" id="update-btn" onclick="manualUpdate()" title="Actualizar app y datos">↻</button>
    <button class="hdr-btn" id="sync-btn" onclick="onSyncBtn()" title="Sincronización" style="display:none">📤<span class="hdr-badge" id="sync-badge" style="display:none">0</span></button>
    <button class="hdr-btn" onclick="toggleTheme()" id="btn-theme" title="Tema">🌙</button>
    <button class="hdr-btn" onclick="doLogout()" title="Salir">⏻</button>
  </div>
</div>

<div class="app" id="app">
  <div class="state">
    <div class="spin-ring"></div>
    <h3>Iniciando…</h3>
  </div>
</div>

<div class="foot" id="foot"></div>
<div class="toast" id="toast"></div>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js" defer></script>
<script>
// ═══════════════════════════════════════════════
// CONFIG
// ═══════════════════════════════════════════════
const SPREADSHEET_ID = '1ZEAfFUN-22FxJH2RL-_bZzePzalgnCzEFzjahxOEOyQ';
// TODO: pegar aquí el Client ID de Google Cloud Console (Credenciales → ID de
// cliente de OAuth → Aplicación web) con origen autorizado
// https://lisandronr2.github.io
const CLIENT_ID = '774353667304-k6j3ult8eero5htrpskpohj6g5aeui3f.apps.googleusercontent.com';

const LS_PREFIX = 'recdavi_';
let APP_VERSION = '1.0.0.0';

// ═══════════════════════════════════════════════
// CONFIG DE HOJAS
// Tipos:
//  - 'ct-item': lista de CT (filas ya existentes en la hoja) → se completan
//    sus campos y se marca el estado. Ideal para hojas con un CT por fila.
//  - 'ensayo': como ct-item pero con hasta 2 puntos de prueba (PP) por fila.
//  - 'gonvarri-pp' / 'gonvarri-ensayos': ambas leen/escriben la hoja
//    FUSIONADO GONVARRI (filas ya existentes, varias por CT). La primera
//    introduce PP. FUSIONADOS (y calcula TOTAL FUSIONES); la segunda marca
//    ENSAYOS REALIZADOS sobre esas mismas filas — por eso "ENSAYOS GONVARRI"
//    declara sourceSheet apuntando al nombre real de la hoja en el Sheet.
// ═══════════════════════════════════════════════
const SHEETS = {
  'MONTAJE ARMARIO COM': {
    type:'ct-item',
    cFecha:0, cAnillo:1, cCt:2, cEstado:3,
    doneValue:'REALIZADO',
    icon:'🔧',
    fields:[],
  },
  'FUSIONADO CTS': {
    type:'ct-item',
    cFecha:0, cAnillo:1, cCt:2, cEstado:6,
    doneValue:'REALIZADO',
    icon:'🔗',
    fields:[
      {key:'cantpp',       col:3, label:'Cant. PP',     kind:'number', placeholder:'1'},
      {key:'preparacion',  col:4, label:'Preparación',  kind:'number', placeholder:'1'},
      {key:'fusiones',     col:5, label:'Fusiones',     kind:'number', placeholder:'48'},
    ],
  },
  // FECHA | CT | ELEMENTO | CANT. PP | PP. FUSIONADOS | TOTAL FUSIONES | ENSAYOS REALIZADOS | FECHA ENSAYOS | PREPARACION
  'FUSIONADO GONVARRI': {
    type:'gonvarri-pp',
    cFecha:0, cCt:1, cElemento:2, cCantPP:3, cPPFusionados:4, cTotalFusiones:5, cEnsayosRealizados:6, cFechaEnsayos:7, cPreparacion:8,
    fusionesPorPP: 8,
    precioFusion: 11.50,
    icon:'🔗',
  },
  'ENSAYOS GONVARRI': {
    type:'gonvarri-ensayos',
    sourceSheet:'FUSIONADO GONVARRI',
    cFecha:7, cCt:1, cElemento:2, cCantPP:3, cTotalFusiones:5, cEnsayosRealizados:6, cFechaEnsayos:7,
    precioEnsayo: 6,
    icon:'🧪',
  },
  // Cada CT necesita 1 o 2 "puntos de prueba" (PP), según CANT PP. Cada PP
  // completado equivale a 24 ensayos individuales, valorizados aparte del
  // resto de conceptos (ver ensayosPorPP/precioEnsayo).
  'ENSAYOS': {
    type:'ensayo',
    cAnillo:0, cCt:1, cCantPP:2, cFusiones:3,
    pp:[
      {cPP:4, cEstado:5, cFecha:6},
      {cPP:7, cEstado:8, cFecha:9},
    ],
    doneValue:'REALIZADO',
    icon:'🧪',
    ensayosPorPP: 24,
    precioEnsayo: 7.5,
  },
};

// Precios de MONTAJE ARMARIO COM / FUSIONADO CTS (mismos que VILLENA PSFV).
// GONVARRI tiene sus propios precios en su propia config (precioFusion/precioEnsayo).
const PRICE_LIST = {
  fusionado:   {label:'Fusionado',                    price:10},
  montaje:     {label:'Montaje CT (armario campo)',   price:50},
  preparacion: {label:'Preparación',                  price:30},
};

// ═══════════════════════════════════════════════
// ESTADO
// ═══════════════════════════════════════════════
let accessToken = null, tokenClient = null;
let sheetCache = {}; // { sheetName: {rows:[{data,sheetRow}], ts} }
let state = { step:'loading' };
let history_ = [];
let toastTmr = null;
let syncingQueue = false;

// ═══════════════════════════════════════════════
// TEMA
// ═══════════════════════════════════════════════
(function initTheme(){
  const saved = localStorage.getItem(LS_PREFIX+'theme');
  if(saved) document.documentElement.setAttribute('data-theme', saved);
  syncThemeIcon();
})();
function toggleTheme(){
  const curr = document.documentElement.getAttribute('data-theme');
  const sys  = window.matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light';
  const next = (curr || sys) === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem(LS_PREFIX+'theme', next);
  syncThemeIcon();
}
function syncThemeIcon(){
  const saved = localStorage.getItem(LS_PREFIX+'theme');
  const sys   = window.matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light';
  document.getElementById('btn-theme').textContent = (saved||sys) === 'dark' ? '☀️' : '🌙';
}

// ═══════════════════════════════════════════════
// AUTENTICACIÓN — Google Identity Services (OAuth2 token flow)
// ═══════════════════════════════════════════════
function waitForGis(){
  return new Promise((resolve,reject)=>{
    let tries=0;
    const t=setInterval(()=>{
      if(window.google?.accounts?.oauth2){ clearInterval(t); resolve(); }
      else if(++tries>100){ clearInterval(t); reject(new Error('No se pudo cargar Google Identity Services')); }
    },100);
  });
}

async function initAuth(){
  if(!CLIENT_ID){
    showFatal('Falta configurar', 'Añade tu CLIENT_ID de Google Cloud Console en index.html (constante CLIENT_ID) para poder conectar con el Sheet.');
    return;
  }
  try{ await waitForGis(); }
  catch(e){ showFatal('Sin conexión', 'No se pudo cargar el sistema de inicio de sesión de Google. Conéctate a internet e inténtalo de nuevo.'); return; }

  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: CLIENT_ID,
    scope: 'https://www.googleapis.com/auth/spreadsheets openid email',
    callback: onTokenReceived,
  });

  const hadAuth = localStorage.getItem(LS_PREFIX+'auth') === '1';
  const email   = localStorage.getItem(LS_PREFIX+'email') || '';

  if(!navigator.onLine){
    if(hadAuth) enterOfflineApp();
    else showFatal('Sin conexión', 'Conéctate a internet para iniciar sesión la primera vez.');
    return;
  }

  if(hadAuth){
    let settled=false;
    const timer=setTimeout(()=>{ if(!settled){ settled=true; showLoginScreen(); } },10000);
    tokenClient.callback = (resp)=>{
      if(settled) return; settled=true; clearTimeout(timer);
      onTokenReceived(resp);
    };
    tokenClient.requestAccessToken({prompt:'', hint: email||undefined});
  } else {
    showLoginScreen();
  }
}

function onTokenReceived(resp){
  if(resp.error){ showLoginScreen(); return; }
  accessToken = resp.access_token;
  localStorage.setItem(LS_PREFIX+'auth','1');
  fetchUserEmail();
  startupApp();
}

async function fetchUserEmail(){
  try{
    const r = await fetch('https://www.googleapis.com/oauth2/v3/userinfo', {headers:{Authorization:`Bearer ${accessToken}`}});
    if(r.ok){ const j = await r.json(); if(j.email) localStorage.setItem(LS_PREFIX+'email', j.email); }
  }catch(e){}
}

function doLogin(){
  if(!tokenClient) return;
  tokenClient.callback = onTokenReceived;
  tokenClient.requestAccessToken({prompt:'consent'});
}
function doLogout(){
  if(accessToken) google.accounts.oauth2.revoke(accessToken, ()=>{});
  accessToken=null;
  localStorage.removeItem(LS_PREFIX+'auth');
  localStorage.removeItem(LS_PREFIX+'email');
  showLoginScreen();
}

function showLoginScreen(){
  document.getElementById('hdr-t2').textContent = 'Sin conectar';
  document.getElementById('app').innerHTML = `
    <div class="state">
      <div class="ico">📝</div>
      <h3>RECDAVI</h3>
      <p>Recogida de datos de producción PSFV Villena-Alicante. Inicia sesión con tu cuenta de Google para empezar.</p>
      <button class="btn btn-primary no-print" style="max-width:260px" onclick="doLogin()">Iniciar sesión con Google</button>
    </div>`;
}
function showFatal(title,msg){
  document.getElementById('app').innerHTML = `<div class="state"><div class="ico">⚠️</div><h3>${esc(title)}</h3><p>${esc(msg)}</p></div>`;
}

function enterOfflineApp(){
  document.getElementById('hdr-t2').textContent = 'Modo sin conexión';
  goHome();
}

async function startupApp(){
  document.getElementById('hdr-t2').textContent = localStorage.getItem(LS_PREFIX+'email') || 'Conectado';
  checkAppVersion();
  await syncQueue();
  goHome();
  prefetchAllSheets();
  updateSyncBadge();
}

// ═══════════════════════════════════════════════
// SHEETS API
// ═══════════════════════════════════════════════
function col(idx){ // 0-based → letra de columna A1
  let n = idx+1, s='';
  while(n>0){ const m=(n-1)%26; s=String.fromCharCode(65+m)+s; n=Math.floor((n-1)/26); }
  return s;
}

async function postJson(url, body, method='POST'){
  if(!navigator.onLine) return {offline:true};
  try{
    const r = await fetch(url, {
      method,
      headers:{Authorization:`Bearer ${accessToken}`, 'Content-Type':'application/json'},
      body: body!==undefined ? JSON.stringify(body) : undefined,
    });
    if(r.status===401){ return {unauthorized:true}; }
    if(!r.ok){ const e=await r.json().catch(()=>({})); throw new Error(e.error?.message||`HTTP ${r.status}`); }
    return await r.json().catch(()=>({}));
  }catch(e){
    if(!navigator.onLine) return {offline:true};
    throw e;
  }
}

async function loadSheetData(sheetName){
  const url = `https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values/${encodeURIComponent(`'${sheetName}'!A:J`)}`;
  const r = await fetch(url, {headers:{Authorization:`Bearer ${accessToken}`}});
  if(r.status===401){ silentLogin(); throw new Error('Sesión expirada, reintenta.'); }
  if(!r.ok){ throw new Error(`HTTP ${r.status}`); }
  const json = await r.json();
  const values = json.values || [];
  const rows = values.slice(1).map((data,i)=>({data, sheetRow:i+2}));
  const entry = {rows, ts:Date.now()};
  sheetCache[sheetName]=entry;
  cacheSheetRows(sheetName, rows);
  return rows;
}

function silentLogin(){
  if(!tokenClient) return;
  tokenClient.callback = onTokenReceived;
  tokenClient.requestAccessToken({prompt:'', hint: localStorage.getItem(LS_PREFIX+'email')||undefined});
}

async function getSheetRows(sheetName, forceNetwork=false){
  if(!forceNetwork && sheetCache[sheetName]) return sheetCache[sheetName].rows;
  if(navigator.onLine){
    try{ return await loadSheetData(sheetName); }
    catch(e){ console.warn('loadSheetData',sheetName,e); }
  }
  const cached = loadSheetFromCache(sheetName);
  if(cached){ sheetCache[sheetName]={rows:cached, ts:Date.now()}; return cached; }
  return [];
}

function cacheSheetRows(sheetName, rows){
  try{ localStorage.setItem(LS_PREFIX+'cache_'+sheetName, JSON.stringify({rows, ts:Date.now()})); }catch(e){}
}
function loadSheetFromCache(sheetName){
  try{
    const raw = localStorage.getItem(LS_PREFIX+'cache_'+sheetName);
    if(!raw) return null;
    return JSON.parse(raw).rows || null;
  }catch(e){ return null; }
}

async function prefetchAllSheets(){
  if(!navigator.onLine) return;
  for(const name of Object.keys(SHEETS)){
    try{ await loadSheetData(name); }catch(e){ console.warn('prefetch',name,e); }
  }
  localStorage.setItem(LS_PREFIX+'last_sync', new Date().toISOString());
}

// ═══════════════════════════════════════════════
// COLA OFFLINE
// ═══════════════════════════════════════════════
function getQueue(){
  try{ return JSON.parse(localStorage.getItem(LS_PREFIX+'queue')||'[]'); }catch(e){ return []; }
}
function setQueue(q){ localStorage.setItem(LS_PREFIX+'queue', JSON.stringify(q)); updateSyncBadge(); }
function queueOp(op){
  const q = getQueue();
  q.push({id: Date.now()+'_'+Math.random().toString(36).slice(2), ts:Date.now(), ...op});
  setQueue(q);
}

async function syncQueue(){
  if(syncingQueue || !navigator.onLine) return;
  const q = getQueue();
  if(!q.length) return;
  syncingQueue = true;
  updateSyncBadge();
  let done=0, remaining=[...q];
  for(const op of q){
    try{
      const res = await runOp(op);
      if(res?.unauthorized){ silentLogin(); break; }
      if(res?.offline) break; // se volvió a cortar, dejar el resto en cola
      remaining = remaining.filter(o=>o.id!==op.id);
      done++;
    }catch(e){
      console.warn('syncQueue op failed, se mantiene en cola', e);
    }
  }
  setQueue(remaining);
  syncingQueue = false;
  updateSyncBadge();
  if(done) toast(`✅ ${done} registro${done>1?'s':''} sincronizado${done>1?'s':''}`, 'ok');
}

async function runOp(op){
  if(op.kind==='batchUpdate'){
    const url = `https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values:batchUpdate`;
    return postJson(url, {valueInputOption:'USER_ENTERED', data:op.updates});
  }
  if(op.kind==='append'){
    const url = `https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values/${encodeURIComponent(op.range)}:append?valueInputOption=USER_ENTERED&insertDataOption=INSERT_ROWS`;
    return postJson(url, {values:[op.values]});
  }
}

function updateSyncBadge(){
  const btn = document.getElementById('sync-btn');
  const badge = document.getElementById('sync-badge');
  const q = getQueue();
  if(!navigator.onLine){
    btn.style.display='flex'; btn.title='Sin conexión'; btn.style.color='#f87171';
    badge.style.display = q.length? 'flex':'none'; badge.textContent=q.length;
    return;
  }
  if(syncingQueue){
    btn.style.display='flex'; btn.title='Sincronizando…';
    badge.style.display='none';
    return;
  }
  if(q.length){
    btn.style.display='flex'; btn.title=`${q.length} pendiente(s) — toca para sincronizar`;
    badge.style.display='flex'; badge.textContent=q.length;
    return;
  }
  btn.style.display='none';
}
function onSyncBtn(){
  if(!navigator.onLine){ toast('📴 Sin conexión','warn'); return; }
  syncQueue();
}

window.addEventListener('online', ()=>{ toast('📶 Conexión restaurada','ok'); syncQueue(); prefetchAllSheets(); updateSyncBadge(); });
window.addEventListener('offline', ()=>{ toast('📴 Sin conexión — se guardará localmente','warn'); updateSyncBadge(); });

// ═══════════════════════════════════════════════
// NAVEGACIÓN / ESTADO
// ═══════════════════════════════════════════════
let future_ = []; // pasos adelante disponibles tras volver atrás con goBack()

function updateNavButtons(){
  document.getElementById('hdr-back').disabled = history_.length===0;
  document.getElementById('hdr-forward').disabled = future_.length===0;
}
function pushHistory(){ history_.push(JSON.stringify(state)); updateNavButtons(); }

// El historial guarda una foto (JSON) de "rows" tal como estaba en ese
// momento, así que un registro guardado después no se reflejaría al
// volver atrás/adelante. Se reengancha al array vivo de sheetCache (el
// mismo que van mutando submitCtItem/submitEnsayo) para que siempre se
// vea al día.
function relinkRows(){
  if(state.sheet && sheetCache[state.sheet]) state.rows = sheetCache[state.sheet].rows;
}

function goBack(){
  if(!history_.length) return;
  future_.push(JSON.stringify(state));
  state = JSON.parse(history_.pop());
  relinkRows();
  updateNavButtons();
  renderStep();
}
function goForward(){
  if(!future_.length) return;
  history_.push(JSON.stringify(state));
  state = JSON.parse(future_.pop());
  relinkRows();
  updateNavButtons();
  renderStep();
}
function goHome(){
  history_ = [];
  future_ = [];
  updateNavButtons();
  state = {step:'home'};
  renderStep();
}
function nav(newState){ pushHistory(); future_ = []; updateNavButtons(); state = {...state, ...newState}; renderStep(); }

function renderStep(){
  const app = document.getElementById('app');
  if(state.step!=='ctlist') app.className = 'app';
  document.getElementById('hdr-t1').textContent = state.menuKey || state.sheet || 'RECDAVI';
  if(state.step==='home'){ document.getElementById('hdr-t1').textContent='RECDAVI'; renderHome(); return; }
  if(state.step==='ctlist'){ renderCtList(); return; }
  if(state.step==='form'){ renderForm(); return; }
  if(state.step==='success'){ renderSuccess(); return; }
  if(state.step==='resumen'){ document.getElementById('hdr-t1').textContent='Resumen'; renderResumenForm(); return; }
  if(state.step==='resumenResult'){ document.getElementById('hdr-t1').textContent='Resumen'; renderResumenResult(); return; }
  if(state.step==='ensayo-form'){ renderEnsayoForm(); return; }
  if(state.step==='gonvarri-ct'){ renderGonvarriCtList(); return; }
  if(state.step==='gonvarri-elemento'){ renderGonvarriElementoList(); return; }
  if(state.step==='gonvarri-pp-form'){ renderGonvarriPPForm(); return; }
  if(state.step==='gonvarri-ensayos-form'){ renderGonvarriEnsayosForm(); return; }
  app.innerHTML = `<div class="state"><div class="spin-ring"></div></div>`;
}

function idSafe(s){ return String(s).replace(/[^a-zA-Z0-9_-]/g,'_'); }

// ENSAYOS: cuántos PP exige la fila (1 o 2, según CANT PP) y si un PP concreto
// ya está marcado como realizado.
function ensayoPPRequired(cfg, data){
  return (parseInt(data[cfg.cCantPP],10) || 1) >= 2 ? 2 : 1;
}
function ensayoPPDone(cfg, data, pp){
  return (data[pp.cEstado]||'').trim().toUpperCase() === cfg.doneValue.toUpperCase();
}
function isRowDone(cfg, data){
  if(cfg.type==='ensayo'){
    const need = ensayoPPRequired(cfg, data);
    return cfg.pp.slice(0, need).every(pp=>ensayoPPDone(cfg, data, pp));
  }
  if(cfg.type==='gonvarri-pp') return gonvarriPPEstado(cfg, data)==='completo';
  if(cfg.type==='gonvarri-ensayos') return gonvarriEnsayoEstado(cfg, data)==='hecho';
  return (data[cfg.cEstado]||'').trim().toUpperCase() === cfg.doneValue.toUpperCase();
}
function ensayoRowCells(cfg, data){
  return cfg.pp.map((pp,n)=>{
    const estado = data[pp.cEstado]||'', fecha = data[pp.cFecha]||'';
    if(!estado && !fecha) return null;
    return `PP${n+1}: ${estado||'-'} (${fecha||'-'})`;
  }).filter(Boolean).join(' · ');
}

// FUSIONADO GONVARRI — fase 1 (PP. FUSIONADOS vs CANT. PP)
function gonvarriPPEstado(cfg, data){
  const raw = data[cfg.cPPFusionados];
  if(raw===undefined || raw===null || String(raw).trim()==='') return 'pendiente';
  const cantPP = parseFloat(data[cfg.cCantPP]) || 0;
  const ppFus = parseFloat(raw) || 0;
  return ppFus >= cantPP ? 'completo' : 'incompleto';
}
// ENSAYOS GONVARRI — fase 2 (¿ya se registró SI/NO?)
function gonvarriEnsayoEstado(cfg, data){
  const raw = data[cfg.cEnsayosRealizados];
  return (raw!==undefined && raw!==null && String(raw).trim()!=='') ? 'hecho' : 'pendiente';
}
// Una fila es elegible para ensayo solo si ya tiene fusiones hechas.
function gonvarriEnsayoElegible(cfg, data){
  return (parseFloat(data[cfg.cTotalFusiones])||0) > 0;
}

const GONVARRI_TYPES = ['gonvarri-pp','gonvarri-ensayos'];
const PROGRESS_TYPES = ['ct-item','ensayo', ...GONVARRI_TYPES];

function renderHome(){
  const app = document.getElementById('app');
  const items = Object.entries(SHEETS).map(([name,cfg])=>{
    const showPct = PROGRESS_TYPES.includes(cfg.type);
    const sid = idSafe(name);
    const subLabel = cfg.type==='gonvarri-pp' ? 'Introducir PP. Fusionados'
      : cfg.type==='gonvarri-ensayos' ? 'Marcar ensayos realizados'
      : cfg.type==='ensayo' ? 'Marcar ensayos (PP) completados'
      : 'Marcar CT completado';
    return `
    <div class="list-item no-print" onclick="openSheet('${esc(name)}')">
      <div style="font-size:22px">${cfg.icon||'📄'}</div>
      <div class="li-main">
        <div class="li-title">${esc(name)}</div>
        <div class="li-sub">${subLabel}</div>
        ${showPct?`<div class="li-progress"><div class="li-progress-bar" id="pb-${sid}"></div></div>`:''}
      </div>
      ${showPct?`<div class="li-pct" id="pct-${sid}">…</div>`:''}
      <div class="li-arrow">›</div>
    </div>`;
  }).join('');
  app.innerHTML = `<div class="wrap">
    <div class="hint">Selecciona la hoja donde quieres registrar producción de hoy.</div>
    ${items}
    <div class="list-item no-print" onclick="openResumen()" style="margin-top:6px">
      <div style="font-size:22px">📊</div>
      <div class="li-main"><div class="li-title">Resumen de producción</div><div class="li-sub">Por fecha, mes o rango · valorización en €</div></div>
      <div class="li-arrow">›</div>
    </div>
  </div>`;
  loadHomeProgress();
}

// Calcula el % de CTs marcados como REALIZADO por hoja y lo pinta en la
// barra correspondiente. Usa getSheetRows (caché primero) así que no
// repite descargas si ya se cargó antes.
async function loadHomeProgress(){
  for(const [name,cfg] of Object.entries(SHEETS)){
    if(!PROGRESS_TYPES.includes(cfg.type)) continue;
    const sid = idSafe(name);
    try{
      const realSheet = cfg.sourceSheet || name;
      const rows = await getSheetRows(realSheet);
      const base = cfg.type==='gonvarri-ensayos' ? rows.filter(r=>gonvarriEnsayoElegible(cfg, r.data)) : rows;
      const total = base.length;
      const done = base.filter(r=>isRowDone(cfg, r.data)).length;
      const pct = total ? Math.round(done/total*100) : 0;
      const bar = document.getElementById('pb-'+sid);
      const lbl = document.getElementById('pct-'+sid);
      if(bar) bar.style.width = pct+'%';
      if(lbl) lbl.textContent = pct+'%';
    }catch(e){
      const lbl = document.getElementById('pct-'+sid);
      if(lbl) lbl.textContent = '—';
    }
  }
}

async function openSheet(name){
  const cfg = SHEETS[name];
  const realSheet = cfg.sourceSheet || name;
  const step = GONVARRI_TYPES.includes(cfg.type) ? 'gonvarri-ct' : 'ctlist';
  nav({menuKey:name, sheet:realSheet, cfg, step, rowIdx:null, formVals:{}, selected:[]});
  document.getElementById('app').innerHTML = `<div class="state"><div class="spin-ring"></div><h3>Cargando…</h3></div>`;
  const rows = await getSheetRows(realSheet);
  state.rows = rows;
  renderStep();
}

function renderCtList(){
  const {cfg, rows=[]} = state;
  if(!Array.isArray(state.selected)) state.selected = [];
  const app = document.getElementById('app');
  if(!rows.length){
    app.innerHTML = `<div class="state"><div class="ico">📭</div><h3>Sin filas</h3><p>No hay CTs cargados en "${esc(state.sheet)}". Verifica el Sheet o sincroniza.</p></div>`;
    return;
  }
  const isEnsayo = cfg.type==='ensayo';
  const n = state.selected.length;
  const items = rows.map((r,i)=>{
    const ct = r.data[cfg.cCt] || `Fila ${r.sheetRow}`;
    const done = isRowDone(cfg, r.data);
    let pill;
    if(isEnsayo){
      const need = ensayoPPRequired(cfg, r.data);
      const doneCount = cfg.pp.slice(0,need).filter(pp=>ensayoPPDone(cfg, r.data, pp)).length;
      pill = done ? `<span class="pill pill-green">🟢 ${esc(cfg.doneValue)}</span>` : `<span class="pill pill-amber">🟡 ${doneCount}/${need} PP</span>`;
    } else {
      pill = done ? `<span class="pill pill-green">🟢 ${esc(cfg.doneValue)}</span>` : `<span class="pill pill-amber">🟡 Pendiente</span>`;
    }
    const isSel = state.selected.includes(i);
    const cls = 'list-item no-print' + (isSel?' sel':'') + (done?' disabled':'');
    const onclick = done ? '' : `toggleCtSelect(${i})`;
    return `<div class="${cls}" onclick="${onclick}">
      <div class="li-check">${isSel?'✓':''}</div>
      <div class="li-main"><div class="li-title">${esc(ct)}</div><div class="li-sub">${cfg.cAnillo!=null && r.data[cfg.cAnillo] ? 'Anillo '+esc(r.data[cfg.cAnillo]) : ''}</div></div>
      ${pill}
    </div>`;
  }).join('');
  app.className = 'app' + (n>0?' has-selbar':'');
  const hint = isEnsayo ? 'toca uno o varios CTs para registrar sus ensayos (PP)' : 'toca uno o varios pendientes para seleccionarlos';
  app.innerHTML = `<div class="wrap"><div class="hint">${esc(state.sheet)} · ${rows.length} CT(s) · ${hint}</div>${items}</div>
    ${n>0?`<div class="selbar no-print">
      <div class="selbar-count">${n} seleccionado${n>1?'s':''}</div>
      <button class="btn btn-secondary" onclick="clearCtSelection()">Limpiar</button>
      <button class="btn btn-primary" onclick="continueMulti()">Continuar</button>
    </div>`:''}`;
}

function toggleCtSelect(i){
  const row = state.rows[i];
  const {cfg} = state;
  const done = isRowDone(cfg, row.data);
  if(done) return;
  if(!Array.isArray(state.selected)) state.selected = [];
  const idx = state.selected.indexOf(i);
  if(idx>=0) state.selected.splice(idx,1);
  else state.selected.push(i);
  renderCtList();
}
function clearCtSelection(){
  state.selected = [];
  renderCtList();
}

function continueMulti(){
  const {cfg, rows} = state;
  const idxs = [...(state.selected||[])];
  if(!idxs.length) return;
  if(cfg.type==='ensayo'){ nav({step:'ensayo-form', selectedIdxs:idxs}); return; }
  const vals = {};
  if(idxs.length===1){
    const row = rows[idxs[0]];
    (cfg.fields||[]).forEach(f=>{ vals[f.key] = row.data[f.col] || ''; });
  }
  nav({step:'form', selectedIdxs:idxs, formVals:vals});
}

function renderEnsayoForm(){
  const {cfg, rows, selectedIdxs} = state;
  const idxs = selectedIdxs || [];
  const app = document.getElementById('app');
  app.className = 'app';

  let anyPending = false;
  const blocks = idxs.map((rowIdx, ci)=>{
    const row = rows[rowIdx];
    const data = row.data;
    const ct = data[cfg.cCt] || `Fila ${row.sheetRow}`;
    const need = ensayoPPRequired(cfg, data);
    const pending = cfg.pp.slice(0, need).map((pp,n)=>({pp,n})).filter(({pp})=>!ensayoPPDone(cfg, data, pp));
    const doneList = cfg.pp.slice(0, need).filter(pp=>ensayoPPDone(cfg, data, pp));
    const doneHtml = doneList.map(pp=>`<div class="li-sub" style="opacity:.6">PP${cfg.pp.indexOf(pp)+1} — ${esc(cfg.doneValue)} (${esc(data[pp.cFecha]||'')})</div>`).join('');

    if(!pending.length){
      return `<div class="card" style="opacity:.6"><div class="li-title">${esc(ct)}</div>${doneHtml}</div>`;
    }
    anyPending = true;
    const checksHtml = pending.map(({pp,n})=>`
      <label style="display:flex;align-items:center;gap:8px">
        <input type="checkbox" id="f-c${ci}-pp${n+1}-ok" ${pending.length===1?'checked':''}> PP${n+1}
        <input type="text" id="f-c${ci}-pp${n+1}-nombre" value="${esc(data[pp.cPP]||'')}" placeholder="Nombre / identificador (opcional)" style="flex:1;margin-left:8px">
      </label>`).join('');
    return `<div class="card">
      <div class="li-title" style="margin-bottom:10px">${esc(ct)}</div>
      ${doneHtml}
      <div style="display:flex;flex-direction:column;gap:12px;margin-top:${doneHtml?'8px':'0'}">${checksHtml}</div>
    </div>`;
  }).join('');

  app.innerHTML = `<div class="wrap">
    <div class="hint">${idxs.length} CT(s) · cada PP realizado equivale a ${cfg.ensayosPorPP} ensayos</div>
    ${blocks}
    ${anyPending?`
    <div class="card">
      <div class="field"><label>Fecha de realización${idxs.length>1?' (misma para todos los marcados)':''}</label><input type="date" id="f-fecha" value="${todayISO()}"></div>
    </div>
    <button class="btn btn-primary no-print" onclick="submitEnsayo()">✅ Guardar</button>` : ''}
  </div>`;
}

async function submitEnsayo(){
  const {cfg, rows, selectedIdxs, sheet} = state;
  const idxs = selectedIdxs || [];

  const toApply = [];
  idxs.forEach((rowIdx, ci)=>{
    const row = rows[rowIdx];
    const data = row.data;
    const need = ensayoPPRequired(cfg, data);
    cfg.pp.slice(0, need).forEach((pp,n)=>{
      if(ensayoPPDone(cfg, data, pp)) return;
      const chk = document.getElementById(`f-c${ci}-pp${n+1}-ok`);
      if(!chk?.checked) return;
      const nombre = document.getElementById(`f-c${ci}-pp${n+1}-nombre`).value.trim();
      toApply.push({row, pp, nombre});
    });
  });
  if(!toApply.length){ toast('Marca al menos un PP como realizado','warn'); return; }

  const fecha = document.getElementById('f-fecha').value;
  if(!fecha){ toast('Selecciona la fecha de realización','warn'); return; }

  const updates = [];
  toApply.forEach(({row,pp,nombre})=>{
    if(nombre) updates.push({range:`'${sheet}'!${col(pp.cPP)}${row.sheetRow}`, values:[[nombre]]});
    updates.push({range:`'${sheet}'!${col(pp.cFecha)}${row.sheetRow}`, values:[[fechaSheetFmt(fecha)]]});
    updates.push({range:`'${sheet}'!${col(pp.cEstado)}${row.sheetRow}`, values:[[cfg.doneValue]]});
  });

  await doSubmit({kind:'batchUpdate', updates}, ()=>{
    applyLocalCellUpdates(updates, rows, sheet);
    state.selected = [];
  });
}

// ═══════════════════════════════════════════════
// FUSIONADO GONVARRI / ENSAYOS GONVARRI
// Flujo: lista de CT → lista de ELEMENTOs de ese CT → formulario (uno a la
// vez, según el tipo de la hoja abierta).
// ═══════════════════════════════════════════════
function renderGonvarriCtList(){
  const {cfg, rows=[], menuKey, sheet} = state;
  const app = document.getElementById('app');
  app.className = 'app';
  if(!rows.length){
    app.innerHTML = `<div class="state"><div class="ico">📭</div><h3>Sin filas</h3><p>No hay datos cargados en "${esc(sheet)}". Verifica el Sheet o sincroniza.</p></div>`;
    return;
  }
  const isEnsayos = cfg.type==='gonvarri-ensayos';
  const groups = new Map();
  rows.forEach((r,i)=>{
    if(!r.data[cfg.cCt] && !r.data[cfg.cElemento]) return; // fila vacía al final de la hoja
    const ct = r.data[cfg.cCt] || '(sin CT)';
    if(!groups.has(ct)) groups.set(ct, []);
    groups.get(ct).push(i);
  });
  const items = [...groups.entries()].map(([ct, idxs])=>{
    let total, done;
    if(isEnsayos){
      const elegibles = idxs.filter(i=>gonvarriEnsayoElegible(cfg, rows[i].data));
      total = elegibles.length;
      done = elegibles.filter(i=>gonvarriEnsayoEstado(cfg, rows[i].data)==='hecho').length;
    } else {
      total = idxs.length;
      done = idxs.filter(i=>gonvarriPPEstado(cfg, rows[i].data)==='completo').length;
    }
    const pct = total ? Math.round(done/total*100) : 0;
    return `<div class="list-item no-print" onclick="openGonvarriCt('${esc(ct)}')">
      <div class="li-main">
        <div class="li-title">CT ${esc(ct)}</div>
        <div class="li-sub">${idxs.length} elemento${idxs.length>1?'s':''}</div>
      </div>
      <span class="pill ${total && pct===100?'pill-green':'pill-amber'}">${done}/${total}</span>
      <div class="li-arrow">›</div>
    </div>`;
  }).join('');
  const hint = isEnsayos ? 'selecciona un CT para registrar sus ensayos' : 'selecciona un CT para introducir PP. Fusionados';
  app.innerHTML = `<div class="wrap"><div class="hint">${esc(menuKey||sheet)} · ${groups.size} CT(s) · ${hint}</div>${items}</div>`;
}

function openGonvarriCt(ct){
  nav({step:'gonvarri-elemento', ctValue: ct, selected:[]});
}

function renderGonvarriElementoList(){
  const {cfg, rows=[], ctValue, menuKey, sheet} = state;
  const app = document.getElementById('app');
  app.className = 'app';
  const isEnsayos = cfg.type==='gonvarri-ensayos';
  if(!Array.isArray(state.selected)) state.selected = [];
  const idxs = rows.map((r,i)=>i).filter(i=>(rows[i].data[cfg.cCt]||'(sin CT)')===ctValue);
  const n = state.selected.length;
  const items = idxs.map(i=>{
    const data = rows[i].data;
    const elemento = data[cfg.cElemento] || `Fila ${rows[i].sheetRow}`;
    let pill, disabled=false;
    if(isEnsayos){
      if(!gonvarriEnsayoElegible(cfg, data)){
        pill = `<span class="pill pill-gray">Sin fusiones</span>`;
        disabled = true;
      } else if(gonvarriEnsayoEstado(cfg, data)==='hecho'){
        const n = parseFloat(data[cfg.cEnsayosRealizados])||0;
        pill = n>0 ? `<span class="pill pill-green">🟢 ${n} ensayos</span>` : `<span class="pill pill-amber">🟡 No realizados</span>`;
      } else {
        pill = `<span class="pill pill-amber">🟡 Pendiente</span>`;
      }
      const cls = 'list-item no-print' + (disabled?' disabled':'');
      const onclick = disabled ? '' : `openGonvarriElemento(${i})`;
      return `<div class="${cls}" onclick="${onclick}">
        <div class="li-main">
          <div class="li-title">${esc(elemento)}</div>
          <div class="li-sub">CANT. PP: ${esc(data[cfg.cCantPP]||'0')}</div>
        </div>
        ${pill}
        <div class="li-arrow">›</div>
      </div>`;
    }
    // gonvarri-pp: selección múltiple (marcar varios como PP.Fusionados = CANT.PP a la vez;
    // para un valor distinto se selecciona solo ese y se entra a editarlo).
    const est = gonvarriPPEstado(cfg, data);
    disabled = est==='completo';
    pill = est==='completo' ? `<span class="pill pill-green">🟢 Completo</span>`
         : est==='incompleto' ? `<span class="pill pill-red">🔴 Incompleto</span>`
         : `<span class="pill pill-amber">🟡 Pendiente</span>`;
    const isSel = state.selected.includes(i);
    const cls = 'list-item no-print' + (isSel?' sel':'') + (disabled?' disabled':'');
    const onclick = disabled ? '' : `toggleGonvarriPPSelect(${i})`;
    return `<div class="${cls}" onclick="${onclick}">
      <div class="li-check">${isSel?'✓':''}</div>
      <div class="li-main">
        <div class="li-title">${esc(elemento)}</div>
        <div class="li-sub">CANT. PP: ${esc(data[cfg.cCantPP]||'0')}</div>
      </div>
      ${pill}
    </div>`;
  }).join('');
  app.className = 'app' + (!isEnsayos && n>0?' has-selbar':'');
  const hint = isEnsayos ? 'selecciona un elemento para registrar el ensayo' : 'toca uno o varios pendientes para marcarlos realizados';
  app.innerHTML = `<div class="wrap"><div class="hint">${esc(menuKey||sheet)} · CT ${esc(ctValue)} · ${hint}</div>${items}</div>
    ${(!isEnsayos && n>0)?`<div class="selbar no-print">
      <div class="selbar-count">${n} seleccionado${n>1?'s':''}</div>
      <button class="btn btn-secondary" onclick="clearGonvarriPPSelection()">Limpiar</button>
      <button class="btn btn-primary" onclick="continueGonvarriPP()">Continuar</button>
    </div>`:''}`;
}

function toggleGonvarriPPSelect(i){

  if(!Array.isArray(state.selected)) state.selected = [];
  const idx = state.selected.indexOf(i);

function applyLocalCellUpdates(updates, rows, sheet){
  updates.forEach(u=>{
    const m = u.range.match(/!([A-Z]+)(\d+)$/);
    const colLetters = m[1], sheetRow = +m[2];
    let ci=0; for(const ch of colLetters) ci = ci*26 + (ch.charCodeAt(0)-64); ci--;
    const r = rows.find(rr=>rr.sheetRow===sheetRow);
    if(r) r.data[ci] = u.values[0][0];
  });
  cacheSheetRows(sheet, rows);
}

async function submitGonvarriPP(){
  const {cfg, rows, selectedIdxs, sheet} = state;
  const idxs = selectedIdxs || [];
  if(!idxs.length) return;

  const fecha = document.getElementById('f-fecha').value;
  if(!fecha){ toast('Selecciona la fecha','warn'); return; }

  // Individual: PP. Fusionados viene del campo editable. Varios a la vez:
  // siempre PP. Fusionados = CANT. PP de cada elemento (no hay edición).
  let ppFusSingle = null;
  if(idxs.length===1){
    const raw = document.getElementById('f-ppfus').value;
    if(raw===''){ toast('Introduce la cantidad de PP. Fusionados','warn'); return; }
    ppFusSingle = parseFloat(raw);
    if(isNaN(ppFusSingle) || ppFusSingle<0){ toast('Cantidad no válida','warn'); return; }
  }

  const updates = [];
  idxs.forEach(i=>{
    const row = rows[i];
    const data = row.data;
    const ppFus = ppFusSingle!==null ? ppFusSingle : (parseFloat(data[cfg.cCantPP])||0);
    const totalFusiones = ppFus * cfg.fusionesPorPP;
    updates.push({range:`'${sheet}'!${col(cfg.cPPFusionados)}${row.sheetRow}`, values:[[ppFus]]});
    updates.push({range:`'${sheet}'!${col(cfg.cTotalFusiones)}${row.sheetRow}`, values:[[totalFusiones]]});
    updates.push({range:`'${sheet}'!${col(cfg.cFecha)}${row.sheetRow}`, values:[[fechaSheetFmt(fecha)]]});
    // Al introducir las fusiones, la preparación de ese elemento queda
    // realizada también (cuenta como 1 preparación en los resúmenes).
    updates.push({range:`'${sheet}'!${col(cfg.cPreparacion)}${row.sheetRow}`, values:[[1]]});
  });

  await doSubmit({kind:'batchUpdate', updates}, ()=>{
    applyLocalCellUpdates(updates, rows, sheet);
    state.selected = [];
  });
}

async function doSubmit(op, applyLocal){
  const btns = document.querySelectorAll('.btn-primary');
  btns.forEach(b=>b.disabled=true);
  try{
    const res = await runOp(op);
    if(res?.unauthorized){ silentLogin(); toast('Sesión expirada, reintenta','warn'); btns.forEach(b=>b.disabled=false); return; }
    if(res?.offline){
      queueOp(op);
      applyLocal();
      toast('📴 Guardado en el dispositivo — se enviará al recuperar conexión','warn');
    } else {
      applyLocal();
      toast('✅ Guardado en el Sheet','ok');
    }
    updateSyncBadge();
    nav({step:'success'});
  }catch(e){
    console.error(e);
    toast('❌ '+e.message,'err');
    btns.forEach(b=>b.disabled=false);
  }
}

// ═══════════════════════════════════════════════
// RESUMEN (producción + valorización en €) — reutiliza PRICE_LIST
// ═══════════════════════════════════════════════
function resParseDate(str){
  if(!str) return null;
  const s = String(str).trim();
  let m = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
  if(m) return new Date(+m[3], +m[2]-1, +m[1]);
  m = s.match(/^(\d{4})[\/\-](\d{2})[\/\-](\d{2})$/);
  if(m) return new Date(+m[1], +m[2]-1, +m[3]);
  return null;
}
function resDateMs(d){ return Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()); }

function openResumen(){ nav({step:'resumen'}); }

function renderResumenForm(){
  const app = document.getElementById('app');
  app.innerHTML = `<div class="wrap">
    <div class="card" style="display:flex;flex-direction:column;gap:12px">
      <div class="field"><label>Tipo de resumen</label><select id="r-modo">
        <option value="produccion">Producción</option>
        <option value="valorizacion">Valorización (€)</option>
      </select></div>
      <div class="field"><label>Buscar por</label><select id="r-tipo" onchange="toggleResTipo()">
        <option value="fecha">Fecha exacta</option>
        <option value="mes">Mes completo</option>

      <div class="field" id="rg-fecha"><label>Fecha</label><input type="date" id="r-fecha" value="${todayISO()}"></div>
      <div class="field" id="rg-mes" style="display:none"><label>Mes y año</label><input type="month" id="r-mes"></div>

  </div>`;

function toggleResTipo(){

let lastResumen = null;

async function runResumen(){
  const modo = document.getElementById('r-modo').value;
  const tipo = document.getElementById('r-tipo').value;
  let fromMs, toMs, label;
  if(tipo==='fecha'){
    const v = document.getElementById('r-fecha').value;
    if(!v){ toast('Selecciona una fecha','warn'); return; }
    const d = new Date(v+'T00:00:00'); fromMs=toMs=resDateMs(d);
    label = d.toLocaleDateString('es-ES',{day:'2-digit',month:'long',year:'numeric'});
  } else if(tipo==='mes'){
    const v = document.getElementById('r-mes').value;
    if(!v){ toast('Selecciona un mes','warn'); return; }
    const [y,mo]=v.split('-').map(Number);
    fromMs=Date.UTC(y,mo-1,1); toMs=Date.UTC(y,mo,0);
    label = new Date(y,mo-1).toLocaleDateString('es-ES',{month:'long',year:'numeric'});
  } else {
    const f=document.getElementById('r-from').value, t=document.getElementById('r-to').value;
    if(!f||!t){ toast('Selecciona el rango','warn'); return; }
    fromMs=resDateMs(new Date(f+'T00:00:00')); toMs=resDateMs(new Date(t+'T00:00:00'));
    if(fromMs>toMs){ toast('La fecha inicial debe ser anterior','warn'); return; }
    label = `${f.split('-').reverse().join('/')} → ${t.split('-').reverse().join('/')}`;
  }

  document.getElementById('app').innerHTML = `<div class="state"><div class="spin-ring"></div><h3>Calculando…</h3></div>`;

  const results = [];
  for(const [name, cfg] of Object.entries(SHEETS)){
    const rows = await getSheetRows(cfg.sourceSheet || name);
    if(!rows.length) continue;
    const inRange = isoDate => {
      const d = resParseDate(isoDate);
      if(!d) return false;
      const ms = resDateMs(d);
      return ms>=fromMs && ms<=toMs;
    };
    const matched = (cfg.type==='ensayo'
      ? rows.filter(r=>cfg.pp.some(pp=>inRange(r.data[pp.cFecha])))
      : rows.filter(r=>inRange(r.data[cfg.cFecha]))
    ).map(r=>r.data);
    if(matched.length) results.push({sheet:name, cfg, rows:matched, fromMs, toMs});
  }

  lastResumen = {modo, label, results};
  nav({step:'resumenResult'});
}

function computeEurosForSheet(name, cfg, rows, range){
  if(cfg.type==='ensayo'){
    const {fromMs, toMs} = range || {};
    let ppCount = 0;
    rows.forEach(data=>{
      const need = ensayoPPRequired(cfg, data);
      cfg.pp.slice(0, need).forEach(pp=>{
        if(!ensayoPPDone(cfg, data, pp)) return;
        const d = resParseDate(data[pp.cFecha]);
        if(!d) return;
        const ms = resDateMs(d);
        if(ms>=fromMs && ms<=toMs) ppCount++;
      });
    });
    const out=[];
    if(ppCount){
      const ensayos = ppCount * cfg.ensayosPorPP;
      out.push({label:'Ensayo', detail:`${ppCount} PP × ${cfg.ensayosPorPP} ensayos = ${ensayos} × ${cfg.precioEnsayo}€`, total: ensayos*cfg.precioEnsayo});
    }
    return {rows:out, totalEuros: out.reduce((s,r)=>s+r.total,0)};
  }
  if(cfg.type==='gonvarri-pp'){
    let totalFusiones = 0, totalPrep = 0;
    rows.forEach(r=>{
      totalFusiones += parseFloat(r[cfg.cTotalFusiones])||0;
      totalPrep += parseFloat(r[cfg.cPreparacion])||0;
    });
    const out=[];
    if(totalFusiones) out.push({label:'Fusiones GONVARRI', detail:`${totalFusiones} × ${cfg.precioFusion}€`, total: totalFusiones*cfg.precioFusion});
    if(totalPrep) out.push({label:PRICE_LIST.preparacion.label, detail:`${totalPrep} × ${PRICE_LIST.preparacion.price}€`, total: totalPrep*PRICE_LIST.preparacion.price});
    return {rows:out, totalEuros: out.reduce((s,r)=>s+r.total,0)};
  }
  if(cfg.type==='gonvarri-ensayos'){
    let totalEnsayos = 0;
    rows.forEach(r=>{ totalEnsayos += parseFloat(r[cfg.cEnsayosRealizados])||0; });
    const out=[];
    if(totalEnsayos) out.push({label:'Ensayos GONVARRI', detail:`${totalEnsayos} × ${cfg.precioEnsayo}€`, total: totalEnsayos*cfg.precioEnsayo});
    return {rows:out, totalEuros: out.reduce((s,r)=>s+r.total,0)};
  }
  const ok = rows.filter(r=>(r[cfg.cEstado]||'').trim().toUpperCase()===cfg.doneValue.toUpperCase());
  const out=[];
  // Concepto principal según el nombre de la hoja/campos
  if(name==='MONTAJE ARMARIO COM'){
    const registros = ok.length;
    if(registros) out.push({label:PRICE_LIST.montaje.label, detail:`${registros} × ${PRICE_LIST.montaje.price}€`, total:registros*PRICE_LIST.montaje.price});
  } else if(name==='FUSIONADO CTS'){
    const fusIdx = (cfg.fields||[]).find(f=>f.key==='fusiones')?.col;
    const prepIdx = (cfg.fields||[]).find(f=>f.key==='preparacion')?.col;
    const fus = fusIdx!=null ? ok.reduce((s,r)=>s+(parseFloat(r[fusIdx])||0),0) : 0;
    const prep = prepIdx!=null ? ok.reduce((s,r)=>s+(parseFloat(r[prepIdx])||0),0) : 0;
    if(fus) out.push({label:PRICE_LIST.fusionado.label, detail:`${fus} × ${PRICE_LIST.fusionado.price}€`, total:fus*PRICE_LIST.fusionado.price});
    if(prep) out.push({label:PRICE_LIST.preparacion.label, detail:`${prep} × ${PRICE_LIST.preparacion.price}€`, total:prep*PRICE_LIST.preparacion.price});
  }
  return {rows:out, totalEuros: out.reduce((s,r)=>s+r.total,0)};
}

// Total "crudo" (sin €) para el modo producción del resumen — reutiliza
// computeEurosForSheet (ya calcula las cantidades correctas por tipo de
// hoja) y solo se queda con la cantidad, descartando el precio.
function produccionResumenTexto(name, cfg, rows, range){
  const priced = computeEurosForSheet(name, cfg, rows, range);
  return priced.rows.map(r=>{
    const m = r.detail.match(/^([\d.,]+)\s*×/);
    return m ? `${m[1]} ${r.label}` : r.detail;
  }).join(' · ');
}

function fmtEuro(n){ return (Math.round(n*100)/100).toLocaleString('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2})+' €'; }

function renderResumenResult(){
  const app = document.getElementById('app');
  const {modo, label, results} = lastResumen;

  if(!results.length){
    app.innerHTML = `<div class="state"><div class="ico">🔍</div><h3>Sin resultados</h3><p>No hay registros para <strong>${esc(label)}</strong>.</p>
      <button class="btn btn-secondary no-print" style="max-width:260px" onclick="nav({step:'resumen'})">Cambiar filtros</button></div>`;
    return;
  }

  if(modo==='valorizacion'){
    const priced = results.map(({sheet,cfg,rows,fromMs,toMs})=>({sheet, ...computeEurosForSheet(sheet,cfg,rows,{fromMs,toMs})})).filter(r=>r.rows.length);
    if(!priced.length){
      app.innerHTML = `<div class="state"><div class="ico">💶</div><h3>Sin producción valorizable</h3><p>Para <strong>${esc(label)}</strong>.</p>
        <button class="btn btn-secondary no-print" style="max-width:260px" onclick="nav({step:'resumen'})">Cambiar filtros</button></div>`;
      return;
    }
    const grand = priced.reduce((s,r)=>s+r.totalEuros,0);
    const blocks = priced.map(({sheet,rows,totalEuros})=>`
      <div class="card" id="print-block">
        <div class="res-block-title"><span>${esc(sheet)}</span><span>${fmtEuro(totalEuros)}</span></div>
        <table class="res-table"><thead><tr><th>Concepto</th><th>Detalle</th><th>Importe</th></tr></thead>
        <tbody>${rows.map(r=>`<tr><td>${esc(r.label)}</td><td>${esc(r.detail)}</td><td class="num">${fmtEuro(r.total)}</td></tr>`).join('')}</tbody>
        <tfoot><tr><td colspan="2">Subtotal</td><td class="num">${fmtEuro(totalEuros)}</td></tr></tfoot></table>
      </div>`).join('');
    app.innerHTML = `<div class="wrap">
      <div class="hint">${esc(label)}</div>
      ${blocks}
      <div class="grand-total"><span>TOTAL GENERAL</span><span>${fmtEuro(grand)}</span></div>
      <div style="display:flex;gap:8px" class="no-print">
        <button class="btn btn-secondary" onclick="printSmart()">🖨 PDF</button>
        <button class="btn btn-secondary" onclick="nav({step:'resumen'})">Cambiar filtros</button>
      </div>
    </div>`;
    return;
  }

  const blocks = results.map(({sheet,cfg,rows,fromMs,toMs})=>{
    const totalTxt = produccionResumenTexto(sheet, cfg, rows, {fromMs,toMs});
    return `
    <div class="card">
      <div class="res-block-title"><span>${esc(sheet)}</span><span>${rows.length} registro${rows.length>1?'s':''}</span></div>
      <table class="res-table"><tbody>
      ${rows.map(r=> cfg.type==='ensayo'
        ? `<tr><td>${esc(r[cfg.cCt]||'')}</td><td colspan="2">${esc(ensayoRowCells(cfg,r))}</td></tr>`
        : cfg.type==='gonvarri-pp'
        ? `<tr><td>${esc(r[cfg.cCt]||'')}</td><td>${esc(r[cfg.cElemento]||'')}</td><td>${esc(r[cfg.cTotalFusiones]||'0')} fusiones</td></tr>`
        : cfg.type==='gonvarri-ensayos'
        ? `<tr><td>${esc(r[cfg.cCt]||'')}</td><td>${esc(r[cfg.cElemento]||'')}</td><td>${esc(r[cfg.cEnsayosRealizados]||'0')} ensayos</td></tr>`
        : `<tr><td>${esc(r[cfg.cFecha]||'')}</td><td>${esc(r[cfg.cCt]||'')}</td><td>${esc((r[cfg.cEstado]||''))}</td></tr>`
      ).join('')}
      </tbody>${totalTxt?`<tfoot><tr><td colspan="3">Total: ${esc(totalTxt)}</td></tr></tfoot>`:''}</table>
    </div>`;
  }).join('');
  app.innerHTML = `<div class="wrap">
    <div class="hint">${esc(label)}</div>
    ${blocks}
    <div style="display:flex;gap:8px" class="no-print">
      <button class="btn btn-secondary" onclick="printSmart()">🖨 PDF</button>
      <button class="btn btn-secondary" onclick="nav({step:'resumen'})">Cambiar filtros</button>
    </div>
  </div>`;
}

// ═══════════════════════════════════════════════
// UI HELPERS
// ═══════════════════════════════════════════════
function toast(msg,type=''){
  const t=document.getElementById('toast');
  t.textContent=msg; t.className='toast'+(type?' '+type:'');
  void t.offsetHeight; t.classList.add('show');
  if(toastTmr) clearTimeout(toastTmr);
  toastTmr=setTimeout(()=>t.classList.remove('show'),3200);
}
function esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

// Genera el PDF directamente en el dispositivo (jsPDF + autoTable) y lo
// comparte/descarga con el share sheet nativo. No depende de
// window.print(), que falla en silencio en muchas apps instaladas según
// el navegador/SO.
async function sharePdf(doc, filename, title){
  const blob = doc.output('blob');
  const file = new File([blob], filename, {type:'application/pdf'});
  if(navigator.canShare && navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file], title}); return; }
    catch(e){ if(e?.name === 'AbortError') return; }
  }
  doc.save(filename);
}

// La fuente estándar de jsPDF (Helvetica/WinAnsi) no soporta ciertos caracteres
// Unicode (→, —, comillas tipográficas, …) — algunos los descarta en silencio,
// pero "→" corrompe el content-stream del PDF y provoca páginas en blanco en
// visores reales. Se sanea todo texto/tabla antes de pasarlo a jsPDF.
function pdfSafe(v){
  return String(v ?? '')
    .replace(/→/g, '-')
    .replace(/←/g, '-')
    .replace(/[–—]/g, '-')
    .replace(/€/g, 'EUR')
    .replace(/[‘’]/g, "'")
    .replace(/[“”]/g, '"')
    .replace(/…/g, '...')
    .replace(/•/g, '-');
}

async function printSmart(){
  if(!lastResumen){ toast('⚠️ Nada que exportar','warn'); return; }
  const { jsPDF } = window.jspdf || {};
  if(!jsPDF){ toast('❌ Generador de PDF no disponible. Revisa tu conexión e intenta de nuevo.','err'); return; }

  const { modo, label, results } = lastResumen;
  const doc = new jsPDF({unit:'pt'});
  const marginL = 30;
  let y = 40;

  doc.setFontSize(16);
  doc.text(pdfSafe('Resumen de Producción - RECDAVI'), marginL, y); y += 18;
  doc.setFontSize(10);
  doc.text(pdfSafe(label), marginL, y); y += 20;

  if(modo === 'valorizacion'){
    const priced = results.map(({sheet,cfg,rows,fromMs,toMs})=>({sheet, ...computeEurosForSheet(sheet,cfg,rows,{fromMs,toMs})})).filter(r=>r.rows.length);
    let grand = 0;
    priced.forEach(({sheet, rows, totalEuros})=>{
      if(y > 700){ doc.addPage(); y = 40; }
      doc.setFontSize(12);
      doc.text(pdfSafe(sheet), marginL, y); y += 4;
      doc.autoTable({
        startY: y,
        head: [['Concepto','Detalle','Importe']],
        body: rows.map(r=>[pdfSafe(r.label), pdfSafe(r.detail), pdfSafe(fmtEuro(r.total))]),
        foot: [['Subtotal','', pdfSafe(fmtEuro(totalEuros))]],
        styles: {fontSize:9, cellPadding:3},
        headStyles: {fillColor:[180,83,9]},
        footStyles: {fillColor:[255,247,237], textColor:[180,83,9], fontStyle:'bold'},
        margin: {left:marginL,right:marginL},
      });
      y = doc.lastAutoTable.finalY + 24;
      grand += totalEuros;
    });
    if(y > 720){ doc.addPage(); y = 40; }
    doc.setFontSize(13);
    doc.setTextColor(180,83,9);
    doc.text(pdfSafe('TOTAL GENERAL: ' + fmtEuro(grand)), marginL, y);
    doc.setTextColor(0,0,0);
  } else {
    results.forEach(({sheet, cfg, rows, fromMs, toMs})=>{
      if(y > 700){ doc.addPage(); y = 40; }
      doc.setFontSize(12);
      doc.text(pdfSafe(`${sheet} (${rows.length} registros)`), marginL, y); y += 4;
      const totalTxt = produccionResumenTexto(sheet, cfg, rows, {fromMs,toMs});
      const colCount = cfg.type==='ensayo' ? 2 : 3;
      doc.autoTable({
        startY: y,
        head: cfg.type==='ensayo' ? [['CT','Ensayos']]
            : cfg.type==='gonvarri-pp' ? [['CT','Elemento','Total fusiones']]
            : cfg.type==='gonvarri-ensayos' ? [['CT','Elemento','Ensayos realizados']]
            : [['Fecha','CT','Estado']],
        body: rows.map(r=> cfg.type==='ensayo'
          ? [pdfSafe(r[cfg.cCt]), pdfSafe(ensayoRowCells(cfg,r))]
          : cfg.type==='gonvarri-pp'
          ? [pdfSafe(r[cfg.cCt]), pdfSafe(r[cfg.cElemento]), pdfSafe(r[cfg.cTotalFusiones]||'0')]
          : cfg.type==='gonvarri-ensayos'
          ? [pdfSafe(r[cfg.cCt]), pdfSafe(r[cfg.cElemento]), pdfSafe(r[cfg.cEnsayosRealizados]||'0')]
          : [pdfSafe(r[cfg.cFecha]), pdfSafe(r[cfg.cCt]), pdfSafe(r[cfg.cEstado])]),
        foot: totalTxt ? [[{content: pdfSafe('Total: '+totalTxt), colSpan: colCount}]] : undefined,
        styles: {fontSize:8, cellPadding:3},
        headStyles: {fillColor:[180,83,9]},
        footStyles: {fillColor:[255,247,237], textColor:[180,83,9], fontStyle:'bold'},
        margin: {left:marginL,right:marginL},
      });
      y = doc.lastAutoTable.finalY + 24;
    });
  }

  await sharePdf(doc, `resumen_${new Date().toISOString().slice(0,10)}.pdf`, 'Resumen de producción');
}

async function checkAppVersion(){
  try{
    const r = await fetch('./version.json',{cache:'no-store'});
    if(!r.ok) return;
    const {v} = await r.json();
    if(!v) return;
    const stored = localStorage.getItem(LS_PREFIX+'app_v');
    if(stored && stored!==v){ toast(`🔄 App actualizada a v${v}`,'ok'); }
    APP_VERSION=v; localStorage.setItem(LS_PREFIX+'app_v', v);
    refreshFoot();
  }catch(e){}
}
function refreshFoot(){
  document.getElementById('foot').textContent = APP_VERSION ? `v${APP_VERSION}` : '';
}

async function registerSW(){
  if(!('serviceWorker' in navigator)) return;
  try{
    const reg = await navigator.serviceWorker.register('sw.js');
    reg.update().catch(()=>{});
    document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') reg.update().catch(()=>{}); });
    reg.addEventListener('updatefound',()=>{
      const nw = reg.installing;
      nw.addEventListener('statechange',()=>{
        if(nw.state==='installed' && navigator.serviceWorker.controller) nw.postMessage({type:'SKIP_WAITING'});
      });
    });
    navigator.serviceWorker.addEventListener('controllerchange',()=>{
      toast('🔄 App actualizada — recargando…','ok');
      setTimeout(()=>window.location.reload(), 1800);
    });
  }catch(e){ console.warn('SW:',e); }
}

// Botón "Actualizar" del header: fuerza una comprobación de versión nueva
// (Service Worker + version.json) y refresca los datos del Sheet.
async function manualUpdate(){
  const btn = document.getElementById('update-btn');
  if(btn) btn.disabled = true;
  toast('🔄 Buscando actualizaciones…','warn');
  try{
    const reg = await navigator.serviceWorker.getRegistration();
    if(reg) await reg.update().catch(()=>{});
    await checkAppVersion();
    if(navigator.onLine){
      await syncQueue();
      await prefetchAllSheets();
      if(state.step==='home') renderHome();
      toast('✅ Todo al día','ok');
    } else {
      toast('📴 Sin conexión — no se pudo actualizar','warn');
    }
  }catch(e){
    toast('❌ '+e.message,'err');
  }finally{
    if(btn) btn.disabled = false;
  }
}

// ═══════════════════════════════════════════════
// ARRANQUE
// ═══════════════════════════════════════════════
refreshFoot();
registerSW();
initAuth().catch(e=>{ console.error(e); showFatal('Error', e.message); });
